spring.application.name=rentar-dssd

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:rentar_user}
spring.datasource.password=${DB_PASSWORD:rentar_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info

# GRAPHQL & GRAPHIQL
spring.graphql.graphiql.enabled=false
spring.graphql.graphiql.path=/graphiql

# JWT Configuration
jwt.secret=rentarSecretKeyForSecurityAuthenticationMustBeAtLeast256BitsLongForHmacSha256
jwt.expiration-ms=86400000

# gRPC Clients Configuration
grpc.client.vehicle-service.address=static://localhost:50052
grpc.client.vehicle-service.negotiation-type=plaintext

grpc.client.customer-service.address=static://localhost:50051
grpc.client.customer-service.negotiation-type=plaintext

grpc.client.rental-service.address=static://localhost:50053
grpc.client.rental-service.negotiation-type=plaintext

# RabbitMQ Connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rentar_rabbit}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rentar_rabbit_pass}
spring.rabbitmq.virtual-host=/
# RabbitMQ Publisher Confirms & Returns
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Nombre del Exchange Central
rentar.rabbitmq.exchange=rentar.topic.exchange
