spring.application.name=rentar-dssd

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:rentar_user}
spring.datasource.password=${DB_PASSWORD:rentar_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
